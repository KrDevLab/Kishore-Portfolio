    <!-- CSS -->
    <link href="style.css" rel="stylesheet">

    <style type="text/tailwindcss">
        @tailwind base;
        @tailwind components;
        @tailwind utilities;

        @layer theme {
            :root {
                --bg-dark: #09090B;
                --bg-darker: #000000;
                --accent-start: #F43F5E;
                --accent-end: #E11D48;
            }
        }

        @layer base {

            html,
            body,
            #root {
                width: 100%;
                overflow-x: hidden;
            }

            body {
                @apply bg-[var(--bg-dark)] text-gray-300 font-['Inter',sans-serif] antialiased;
            }

            h1,
            h2,
            h3,
            h4,
            h5,
            h6 {
                @apply font-['Poppins',sans-serif] text-white tracking-tight;
            }
        }

        @layer components {

            .glass-card {
                @apply bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl shadow-[0_4px_30px_rgba(0,0,0,0.1)];
            }

            .text-gradient {
                @apply bg-clip-text text-transparent bg-gradient-to-r from-[var(--accent-start)] to-[var(--accent-end)];
            }

            .btn-primary {
                @apply relative inline-flex items-center justify-center px-8 py-3 font-semibold text-white transition-all duration-300 bg-gradient-to-r from-[var(--accent-start)] to-[var(--accent-end)] rounded-full hover:shadow-[0_0_20px_rgba(139,92,246,0.5)] hover:scale-105;
            }

            .btn-outline {
                @apply relative inline-flex items-center justify-center px-8 py-3 font-semibold text-white transition-all duration-300 border border-white/20 rounded-full hover:bg-white/10 hover:border-white/40;
            }
        }

        @layer utilities {

            .reveal,
            .reveal-left,
            .reveal-right,
            .reveal-scale {
                opacity: 0;
                transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
            }

            .reveal {
                transform: translateY(40px);
            }

            .reveal-left {
                transform: translateX(-40px);
            }

            .reveal-right {
                transform: translateX(40px);
            }

            .reveal-scale {
                transform: scale(0.9);
            }

            .reveal.active,
            .reveal-left.active,
            .reveal-right.active,
            .reveal-scale.active {
                opacity: 1;
                transform: translate(0) scale(1);
            }

            .blob {
                position: absolute;
                filter: blur(80px);
                z-index: -1;
                opacity: 0.4;
                animation: float 10s ease-in-out infinite alternate;
            }

            @keyframes float {
                0% {
                    transform: translate(0, 0) scale(1);
                }

                50% {
                    transform: translate(30px, -50px) scale(1.1);
                }

                100% {
                    transform: translate(-20px, 20px) scale(0.9);
                }
            }
        }
    </style>
</head>

<body class="selection:bg-[var(--accent-start)] selection:text-white">

</body>
