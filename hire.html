            --bg-darker: #000000;
            --accent-start: #F43F5E;

            @apply bg-[var(--bg-dark)] text-gray-300 font-['Inter',sans-serif] overflow-x-hidden antialiased;
        }
        h1, h2, h3, h4, h5, h6 {

        .glass-card {
            @apply bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl shadow-[0_4px_30px_rgba(0,0,0,0.1)];
        }
        .text-gradient {
            @apply bg-clip-text text-transparent bg-gradient-to-r from-[var(--accent-start)] to-[var(--accent-end)];
        }
        .btn-primary {
            @apply relative inline-flex items-center justify-center px-8 py-3 font-semibold text-white transition-all duration-300 bg-gradient-to-r from-[var(--accent-start)] to-[var(--accent-end)] rounded-full hover:shadow-[0_0_20px_rgba(139,92,246,0.5)] hover:scale-105;
